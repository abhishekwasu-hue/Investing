name: Weekly Long-Term Investment Screener
on:
  schedule:
    - cron: '30 10 * * 6' # दर शनिवारी दुपारी ठीक ०४:०० वाजता IST ऑटोमॅटिक चालू होईल
  workflow_dispatch:      # मॅन्युअल टेस्ट करण्याचे हिरवे बटण

jobs:
  analyze_and_report:
    runs-on: ubuntu-latest
    steps:
      - name: Load Repository Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0 # संपूर्ण इतिहास वाचण्यासाठी
        
      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Quant Dependencies
        run: pip install requests pandas numpy yfinance
        
      - name: Run 5-Year Nifty 1000 Database Sync
        run: python investment_database.py

      - name: Run Master Performance Report Dispatcher
        run: python investment_reporter.py

      - name: Securely Commit and Push Data Warehouse Changes
        run: |
          git config --global user.name "Nifty1000ResearchBot"
          git config --global user.email "research@algo.terminal"
          
          # सर्व नवीन डाऊनलोड झालेल्या फाईल्स ट्रॅक करणे
          git add investment_data_warehouse/*.csv || true
          git add investment_master_mapping.csv || true
          
          # 🟢 जर काही बदल झाला असेल तरच कमिट करणे, अन्यथा एरर न देता शांतपणे एक्झिट होणे
          if git diff --quiet && git diff --staged --quiet; then
            echo "No incremental data updates detected today. Repository is already optimized."
          else
            git commit -m "📊 Automated Weekly Nifty 1000 Warehouse Update [Skip CI]"
            git push origin HEAD:${{ github.ref }}
          fi
